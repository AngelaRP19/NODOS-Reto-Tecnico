expansionpack.enchanted.name=The Sims™ 4: Enchanted Nature
expansionpack.enchanted.description=Connect with the magic of the forest and wildlife! Discover mystical creatures, learn herbalism, build sustainable shelters, and master the art of mystical botany in stunning natural environments.
expansionpack.enchanted.category=Expansion Pack
expansionpack.enchanted.platforms=PC / Mac / Consoles
expansionpack.enchanted.publicationDate=Recent Release
expansionpack.enchanted.characteristic.1=New explorable world: Fairy Grove.
expansionpack.enchanted.characteristic.2=Special skill: Herbalism and Natural Magic.
expansionpack.enchanted.characteristic.3=Interactive magical creatures and forest sprites.
expansionpack.enchanted.characteristic.4=Rustic wood furniture and free-spirited clothing.

expansionpack.legacy.name=The Sims™ 4: Royal Dynasty
expansionpack.legacy.description=Create prosperous kingdoms, define your royal family legacy, and master protocol or palace intrigue. Build majestic castles, host lavish banquets, and guide your lineage through generations.
expansionpack.legacy.category=Expansion Pack
expansionpack.legacy.platforms=PC / Mac / Consoles
expansionpack.legacy.publicationDate=Recent Release
expansionpack.legacy.characteristic.1=Exclusive world: Royal City Region.
expansionpack.legacy.characteristic.2=Court mechanics, noble titles, and advanced family trees.
expansionpack.legacy.characteristic.3=Medieval build objects and opulent gala attire.
expansionpack.legacy.characteristic.4=New aspirations: Just Monarch or Machiavellian.

expansionpack.horse_ranch.name=The Sims™ 4: Horse Ranch
expansionpack.horse_ranch.description=Join the Chestnut Ridge community and create your own equestrian lifestyle! Care for, train, and bond with majestic horses, customize your ranch, and live the countryside experience.
expansionpack.horse_ranch.category=Expansion Pack
expansionpack.horse_ranch.platforms=PC / Mac / Consoles
expansionpack.horse_ranch.publicationDate=Recent Release
expansionpack.horse_ranch.characteristic.1=Explorable world: Chestnut Ridge.
expansionpack.horse_ranch.characteristic.2=Horse care, training, and breeding.
expansionpack.horse_ranch.characteristic.3=Nectar crafting and line dancing.
expansionpack.horse_ranch.characteristic.4=New animals: Mini goats and mini sheep.

expansionpack.cottage_living.name=The Sims™ 4: Cottage Living
expansionpack.cottage_living.description=Enjoy rural life by creating a farm, caring for animals, and exploring a charming village in Henford-on-Bagley. Grow fresh produce, raise animals, and participate in traditional fairs.
expansionpack.cottage_living.category=Expansion Pack
expansionpack.cottage_living.platforms=PC / Mac / Consoles
expansionpack.cottage_living.publicationDate=Recent Release
expansionpack.cottage_living.characteristic.1=Experience rural life in Henford-on-Bagley.
expansionpack.cottage_living.characteristic.2=Grow, raise animals, attend fairs, and enjoy tradition.
expansionpack.cottage_living.characteristic.3=Take your Sims out of the city and into the countryside. Build a farm!
expansionpack.cottage_living.characteristic.4=Complete daily activities and enjoy traditional rural fairs.

expansionpack.cats_dogs.name=The Sims™ 4: Cats & Dogs
expansionpack.cats_dogs.description=Grow your family with adorable pets and enjoy unforgettable adventures alongside them in the beautiful coastal world of Brindleton Bay.
expansionpack.cats_dogs.category=Expansion Pack
expansionpack.cats_dogs.platforms=PC / Mac / Consoles
expansionpack.cats_dogs.publicationDate=Recent Release
expansionpack.cats_dogs.characteristic.1=Open your own veterinary clinic and care for pets.
expansionpack.cats_dogs.characteristic.2=Care, train, and play with dogs and cats while strengthening bonds.
expansionpack.cats_dogs.characteristic.3=Customize unique pets and accompany your Sims in a loving adventure.
expansionpack.cats_dogs.characteristic.4=Adopt dogs and cats, care for them, and build a loving home.

expansionpack.get_to_work.name=The Sims™ 4: Get to Work
expansionpack.get_to_work.description=Take your Sims to work and discover professions full of challenge, fun, and the opportunity to build your own business.
expansionpack.get_to_work.category=Expansion Pack
expansionpack.get_to_work.platforms=PC / Mac / Consoles
expansionpack.get_to_work.publicationDate=Recent Release
expansionpack.get_to_work.characteristic.1=Control each workday and build a successful career full of opportunities.
expansionpack.get_to_work.characteristic.2=Explore new professions and decide your Sims' future in every shift.
expansionpack.get_to_work.characteristic.3=Become a doctor, detective, or scientist and experience thrilling work adventures.
expansionpack.get_to_work.characteristic.4=Open your own business and grow an empire with your entrepreneurial skills.

challenge.enchanted_garden.name=Challenge: Enchanted Garden
challenge.enchanted_garden.description=Build the most magical garden possible: combine exotic flora, mystical creatures, and outdoor relaxation spaces for your Sims.
challenge.royal_dynasty.name=Challenge: Royal Dynasty
challenge.royal_dynasty.description=Found a royal lineage and carry it through three generations without losing the throne: manage protocol, alliances, and family heritage.
challenge.perfect_ranch.name=Challenge: Perfect Ranch
challenge.perfect_ranch.description=Create the best horse ranch in Chestnut Ridge: train, breed, and compete with your horses until you win your first cup.
challenge.cottage_life.name=Challenge: Cottage Life
challenge.cottage_life.description=Live a full month in the countryside: farm, raise animals, and participate in every village fairs without buying anything from the supermarket.
challenge.pet_shelter.name=Challenge: Pet Shelter
challenge.pet_shelter.description=Open a shelter and care for as many dogs and cats as possible, keeping them happy and healthy.
challenge.simmer_entrepreneur.name=Challenge: Simmer Entrepreneur
challenge.simmer_entrepreneur.description=Start a business from scratch and turn it into a profitable empire in less than a month of game time.

