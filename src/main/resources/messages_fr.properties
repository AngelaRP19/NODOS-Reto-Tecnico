expansionpack.enchanted.name=The Sims™ 4: Nature Enchantée
expansionpack.enchanted.description=Connectez-vous à la magie de la forêt et de la faune ! Découvrez des créatures mystiques, apprenez l'herboristerie, construisez des abris durables et maîtrisez la botanique mystique.
