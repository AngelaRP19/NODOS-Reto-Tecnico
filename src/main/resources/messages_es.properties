expansionpack.enchanted.name=The Sims™ 4: Naturaleza Encantada
expansionpack.enchanted.description=Conéctate con la magia del bosque y la vida silvestre. Descubre criaturas místicas, aprende herbalismo, construye refugios sostenibles y domina la botánica mística en entornos naturales impresionantes.
expansionpack.enchanted.category=Pack de expansión
expansionpack.enchanted.platforms=PC / Mac / Consolas
expansionpack.enchanted.publicationDate=Lanzamiento reciente
expansionpack.enchanted.characteristic.1=Nuevo mundo explorable: Arboleda de las Hadas.
expansionpack.enchanted.characteristic.2=Habilidad especial: Herbalismo y Magia Natural.
expansionpack.enchanted.characteristic.3=Criaturas mágicas y duendes de bosque interactivos.
expansionpack.enchanted.characteristic.4=Muebles de madera rústica y vestuario de espíritu libre.

expansionpack.legacy.name=The Sims™ 4: Dinastías y Linajes
expansionpack.legacy.description=Crea reinos prósperos, define la herencia de tu familia real y domina el protocolo o la intriga palaciega. Construye castillos majestuosos, organiza banquetes suntuosos y guía tu linaje a través de generaciones.
expansionpack.legacy.category=Pack de expansión
expansionpack.legacy.platforms=PC / Mac / Consolas
expansionpack.legacy.publicationDate=Lanzamiento reciente
expansionpack.legacy.characteristic.1=Mundo exclusivo: Región de Ciudad Real.
expansionpack.legacy.characteristic.2=Mecánicas de corte, títulos nobiliarios y árboles genealógicos avanzados.
expansionpack.legacy.characteristic.3=Muebles medievales y atuendo de gala opulento.
expansionpack.legacy.characteristic.4=Nuevas aspiraciones: Monarca Justo o Maquiavélico.

expansionpack.horse_ranch.name=The Sims™ 4: Rancho de Caballos
expansionpack.horse_ranch.description=Únete a la comunidad de Chestnut Ridge y crea tu propio estilo de vida ecuestre. Cuida, entrena y forma vínculo con caballos majestuosos, personaliza tu rancho y vive la experiencia del campo.
expansionpack.horse_ranch.category=Pack de expansión
expansionpack.horse_ranch.platforms=PC / Mac / Consolas
expansionpack.horse_ranch.publicationDate=Lanzamiento reciente
expansionpack.horse_ranch.characteristic.1=Mundo explorable: Chestnut Ridge.
expansionpack.horse_ranch.characteristic.2=Cuidado, entrenamiento y cría de caballos.
expansionpack.horse_ranch.characteristic.3=Fabricación de néctar y baile en línea.
expansionpack.horse_ranch.characteristic.4=Nuevos animales: Mini cabras y mini ovejas.

expansionpack.cottage_living.name=The Sims™ 4: Vida en el Pueblo
expansionpack.cottage_living.description=Disfruta de la vida rural creando una granja, cuidando animales y explorando un encantador pueblo en Henford-on-Bagley. Cultiva productos frescos, cría animales y participa en ferias tradicionales.
expansionpack.cottage_living.category=Pack de expansión
expansionpack.cottage_living.platforms=PC / Mac / Consolas
expansionpack.cottage_living.publicationDate=Lanzamiento reciente
expansionpack.cottage_living.characteristic.1=Vive la vida rural en Henford-on-Bagley.
expansionpack.cottage_living.characteristic.2=Cultiva, cría animales, asiste a ferias y disfruta de la tradición.
expansionpack.cottage_living.characteristic.3=Lleva a tus Sims fuera de la ciudad y al campo. ¡Construye una granja!
expansionpack.cottage_living.characteristic.4=Realiza actividades diarias y disfruta de las ferias rurales tradicionales.

expansionpack.cats_dogs.name=The Sims™ 4: Perros y Gatos
expansionpack.cats_dogs.description=Haz crecer tu familia con adorables mascotas y vive aventuras inolvidables junto a ellas en el hermoso mundo costero de Brindleton Bay.
expansionpack.cats_dogs.category=Pack de expansión
expansionpack.cats_dogs.platforms=PC / Mac / Consolas
expansionpack.cats_dogs.publicationDate=Lanzamiento reciente
expansionpack.cats_dogs.characteristic.1=Abre tu propia clínica veterinaria y cuida mascotas.
expansionpack.cats_dogs.characteristic.2=Cuida, entrena y juega con perros y gatos mientras fortaleces el vínculo.
expansionpack.cats_dogs.characteristic.3=Personaliza mascotas únicas y acompaña a tus Sims en una aventura cariñosa.
expansionpack.cats_dogs.characteristic.4=Adopta perros y gatos, cuídalos con cariño y crea un hogar lleno de amor.

expansionpack.get_to_work.name=The Sims™ 4: ¡A Trabajar!
expansionpack.get_to_work.description=Lleva a tus Sims al trabajo y descubre profesiones llenas de desafíos, diversión y la oportunidad de crear tu propio negocio.
expansionpack.get_to_work.category=Pack de expansión
expansionpack.get_to_work.platforms=PC / Mac / Consolas
expansionpack.get_to_work.publicationDate=Lanzamiento reciente
expansionpack.get_to_work.characteristic.1=Controla cada jornada laboral y construye una carrera exitosa.
expansionpack.get_to_work.characteristic.2=Explora nuevas profesiones y decide el futuro de tus Sims en cada turno.
expansionpack.get_to_work.characteristic.3=Conviértete en médico, detective o científico y vive aventuras profesionales.
expansionpack.get_to_work.characteristic.4=Abre tu propio negocio y haz crecer un imperio con tus habilidades.

challenge.enchanted_garden.name=Reto: Jardín Encantado
challenge.enchanted_garden.description=Construye el jardín más mágico posible: combina flora exótica, criaturas místicas y espacios de descanso al aire libre para tus Sims.
challenge.royal_dynasty.name=Reto: Dinastía Real
challenge.royal_dynasty.description=Funda un linaje real y llévalo a través de tres generaciones sin perder el trono: gestiona protocolo, alianzas y patrimonio familiar.
challenge.perfect_ranch.name=Reto: Rancho Perfecto
challenge.perfect_ranch.description=Crea el mejor rancho de caballos en Chestnut Ridge: entrena, cría y compite con tus caballos hasta ganar tu primera copa.
challenge.cottage_life.name=Reto: Vida de Pueblo
challenge.cottage_life.description=Vive un mes entero en el campo: cultiva, cría animales y participa en todas las ferias del pueblo sin comprar nada en el supermercado.
challenge.pet_shelter.name=Reto: Refugio de Mascotas
challenge.pet_shelter.description=Abre un refugio y cuida la mayor cantidad posible de perros y gatos, manteniéndolos felices y saludables.
challenge.simmer_entrepreneur.name=Reto: Emprendedor Simmer
challenge.simmer_entrepreneur.description=Inicia un negocio desde cero y conviértelo en un imperio rentable en menos de un mes de juego.

