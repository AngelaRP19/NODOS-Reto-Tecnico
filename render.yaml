databases:
  - name: nodos-db
    plan: free
    databaseName: nodos_db
    user: nodos_user
    postgresMajorVersion: "16"

services:
  - type: web
    name: reto-tecnico-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8081
      - key: DB_HOST
        fromDatabase:
          name: nodos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nodos-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nodos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nodos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nodos-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRYPTO_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
